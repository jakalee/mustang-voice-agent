<title>소나기, 난 여기 있어</title>

<style>

:root{

  --display:"Gowun Batang", "AppleMyungjo", "Batang", serif;

html,body{background:var(--page);color:var(--fg)}
body{font-family:var(--ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 32px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

.wrap:has(.stage.v){max-width:640px}

.bar{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.bar button{background:none;border:1px solid var(--line);color:var(--fg);border-radius:4px;padding:6px 12px;font:14px var(--ui);cursor:pointer;min-width:64px}
#seek{flex:1;min-width:0;accent-color:var(--accent)}
#time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;white-space:nowrap}
.note{color:var(--muted);font-size:12.5px;line-height:1.6;max-width:70ch;margin:0}
@media (prefers-reduced-motion: reduce){#big{backdrop-filter:none}}

<div class="wrap">
  <header>
    <h1>소나기, 난 여기 있어</h1>

  </header>
  <div class="stage">

<script>
(() => {
const V = new URLSearchParams(location.search).get('o') !== 'h';   // 기본 세로(9:16), ?o=h 이면 가로
const W = V ? 1080 : 1920, H = V ? 1920 : 1080, DUR = 166.5;
const C = document.getElementById('c'), X = C.getContext('2d');
C.width = W; C.height = H; C.parentElement.classList.toggle('v', V);
const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const O = mk(), OX = O.getContext('2d');   // 창밖(유리 안쪽에 보이는 것)
const F = mk(), FX = F.getContext('2d');   // 김서림 층
const M = mk(), MX = M.getContext('2d');   // 브러시로 닦아낸 마스크
let ctx = X;

// ---------- 기본 수학 ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const sm = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const hh = (a, b = 0) => { const s = Math.sin(a * 127.1 + b * 311.7 + 0.123) * 43758.5453; return s - Math.floor(s); };
const hexA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const mixHex = (h1, h2, u) => { const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
  const r = Math.round(lerp(a >> 16, b >> 16, u)), g = Math.round(lerp((a >> 8) & 255, (b >> 8) & 255, u)), bl = Math.round(lerp(a & 255, b & 255, u));
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + bl).toString(16).slice(1); };

// ---------- 펜 ----------
let fb = 0;            // 선 떨림 프레임 (초당 8번 바뀜)
let J = 0.9;           // 떨림 크기
const P = { paper: '#e8e4da', ink: '#23262c', warm: '#f0b45a', fill: '#e8e4da', accent: '#b5523b' };
function jp(x, y, k) { return [x + (hh(k, fb) - .5) * 2 * J, y + (hh(k + 71.3, fb) - .5) * 2 * J]; }
function trace(q, closed) {
  const n = q.length;
  if (n === 2) { ctx.moveTo(q[0][0], q[0][1]); ctx.lineTo(q[1][0], q[1][1]); return; }
  if (closed) {
    const m = (i, j) => [(q[i][0] + q[j][0]) / 2, (q[i][1] + q[j][1]) / 2];
    let s = m(n - 1, 0); ctx.moveTo(s[0], s[1]);
    for (let i = 0; i < n; i++) { const e = m(i, (i + 1) % n); ctx.quadraticCurveTo(q[i][0], q[i][1], e[0], e[1]); }
    ctx.closePath(); return;
  }
  ctx.moveTo(q[0][0], q[0][1]);
  for (let i = 1; i < n - 1; i++) { const e = [(q[i][0] + q[i + 1][0]) / 2, (q[i][1] + q[i + 1][1]) / 2]; ctx.quadraticCurveTo(q[i][0], q[i][1], e[0], e[1]); }
  ctx.lineTo(q[n - 1][0], q[n - 1][1]);
}
function pen(pts, w = 2.2, k = 0, o = {}) {
  const q = pts.map((p, i) => jp(p[0], p[1], k + i * 1.37));
  ctx.beginPath();
  if (o.sharp) { ctx.moveTo(q[0][0], q[0][1]); for (let i = 1; i < q.length; i++) ctx.lineTo(q[i][0], q[i][1]); if (o.closed) ctx.closePath(); }
  else trace(q, !!o.closed);
  if (o.fill) { ctx.fillStyle = o.fill; ctx.fill(); }
  if (w > 0) { ctx.lineWidth = w; ctx.strokeStyle = o.col || P.ink; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(); }
}
function ln(x1, y1, x2, y2, w = 2, k = 0, col) {
  const len = Math.hypot(x2 - x1, y2 - y1), nx = -(y2 - y1) / (len || 1), ny = (x2 - x1) / (len || 1);
  const b = (hh(k, 3.3) - .5) * len * 0.02;
  const a = jp(x1, y1, k), c = jp(x2, y2, k + 5.1);
  ctx.beginPath(); ctx.moveTo(a[0], a[1]);
  ctx.quadraticCurveTo((x1 + x2) / 2 + nx * b, (y1 + y2) / 2 + ny * b, c[0], c[1]);
  ctx.lineWidth = w; ctx.strokeStyle = col || P.ink; ctx.lineCap = 'round'; ctx.stroke();
}
function box(x, y, w, h, lw = 2, k = 0, o = {}) {
  const c = [jp(x, y, k), jp(x + w, y, k + 1), jp(x + w, y + h, k + 2), jp(x, y + h, k + 3)];
  const bw = (hh(k, 9) - .5) * 0.012;
  ctx.beginPath(); ctx.moveTo(c[0][0], c[0][1]);
  for (let i = 0; i < 4; i++) { const a = c[i], b = c[(i + 1) % 4];
    const nx = -(b[1] - a[1]), ny = b[0] - a[0];
    ctx.quadraticCurveTo((a[0] + b[0]) / 2 + nx * bw, (a[1] + b[1]) / 2 + ny * bw, b[0], b[1]); }
  ctx.closePath();
  if (o.fill) { ctx.fillStyle = o.fill; ctx.fill(); }
  if (lw > 0) { ctx.lineWidth = lw; ctx.strokeStyle = o.col || P.ink; ctx.lineJoin = 'round'; ctx.stroke(); }
}
function ell(x, y, rx, ry, lw = 2, k = 0, o = {}) {
  const n = 14, pts = [];
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2 + (o.rot || 0); pts.push([x + Math.cos(a) * rx, y + Math.sin(a) * ry]); }
  pen(pts, lw, k, { closed: true, fill: o.fill, col: o.col });
}
function glow(x, y, r, col, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, hexA(col, a)); g.addColorStop(0.35, hexA(col, a * 0.45)); g.addColorStop(1, hexA(col, 0));
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}

// ---------- 가사 (곡 구간 분석 기준 근사 타이밍) ----------
const LYRICS = [ // [시작, 가사, 끝(선택)] — 보컬 분리 + 음성인식으로 측정
  [9.3, '(빗소리가 들려)'], [12.5, '갑자기 내린 여름 비에'], [19.2, '흩어진 내 마음들 같아'], [22.0, '흐려진 하늘을 보며 난'],
  [26.0, '여전히 이곳에 서있어'], [28.6, '멀리서 울리는 바이올린'], [32.4, '그 소리에 난 눈물 흘려', 37.5],
  [39.9, '소나기처럼 내리는 날'], [44.2, '다시 너를 부르고 있어'], [48.0, '이 비가 그치면 너도', 55.2], [56.1, '멀리 사라질까 두려워'],
  [61.1, '창가에 흐르는 빗물들'], [67.2, '지워진 기억들을 불러'], [71.0, '너의 그 목소리가 들려'],
  [73.9, '이 빗소리 속에 묻혀서'], [77.1, '아름답던 우리 날들이'], [79.8, '이렇게 눈앞에 아른대', 85.5],
  [87.9, '소나기처럼 내리는 날'], [91.1, '다시 너를 부르고 있어', 98.0], [99.0, '이 비가 그치면 너도'], [104.2, '멀리 사라질까 두려워', 111.5],
  [113.5, '소나기처럼 내리는 날', 117.4],
  [118.2, '영원히 난 이 자리에', 123.8], [125.1, '잠시만이라도 머물러'], [129.3, '그 눈빛을 나에게 보여줘'],
  [134.8, '멈춰버린 이 시간 속에'], [138.3, '너를 다시 안고 싶어', 142.4],
  [143.4, '비가 그쳐도', 149.2], [155.0, '여전히 아~', 161.8], [166.5, null]
];
function lyric(t) {
  let i = -1; for (let j = 0; j < LYRICS.length; j++) if (t >= LYRICS[j][0]) i = j;
  if (i < 0 || !LYRICS[i][1]) return;
  const t0 = LYRICS[i][0], end = LYRICS[i][2] || (LYRICS[i + 1] ? LYRICS[i + 1][0] : DUR) - 0.25;
  const a = sm(t0, t0 + 0.45, t) * (1 - sm(end - 0.45, end, t));
  if (a <= 0) return;
  X.setTransform(1, 0, 0, 1, 0, 0);
  X.font = `700 ${V ? 56 : 48}px "Gowun Batang", serif`; X.textAlign = 'center'; X.textBaseline = 'alphabetic';
  X.globalAlpha = a;
  X.lineWidth = 9; X.strokeStyle = 'rgba(18,20,26,0.78)'; X.lineJoin = 'round';
  const ly = V ? 1440 : H - 64;
  X.strokeText(LYRICS[i][1], W / 2, ly);
  X.fillStyle = '#f4efe4'; X.fillText(LYRICS[i][1], W / 2, ly);
  X.globalAlpha = 1;
}

// ---------- 비 ----------
function rainAmt(t) {
  return 0.12 * sm(24, 30, t) * (1 - sm(38.2, 38.5, t)) + sm(38.2, 39.0, t) * (1 - 0.92 * sm(153, 161, t)) * (1 - sm(161, 164.5, t));
}
function rain(t, amt, x0, y0, w, h, col, lw = 1.6, density = 900, seed = 0, speed = 2300, slant = 0.18) {
  const n = Math.floor(density * amt); if (n <= 0) return;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = hh(i + seed, 1), b = hh(i + seed, 2), c = hh(i + seed, 3);
    const v = speed * (0.75 + 0.5 * b), L = 26 + 40 * c;
    const span = h + 200;
    const y = ((t * v + a * 9973) % span) + y0 - 100;
    const x = x0 + ((a * 7919 + b * 131) % 1) * (w + 300) - 150 + (y - y0) * slant;
    ctx.moveTo(x, y); ctx.lineTo(x - L * slant, y - L);
  }
  ctx.lineWidth = lw; ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.stroke();
}

// ---------- 사람 ----------
const SW = 130, SR = 230, FIG_S = 1.55;
const BEAT = 60 / 76;
const VW = SW * FIG_S / (2 * BEAT), VR = SR * FIG_S / BEAT;
const T_W0 = 4.0, T_RUN = 38.25, T_DEC = 49.3, T_STOP = 50.1, TA = 0.7;
function speedAt(t) {
  if (t < T_W0) return 0;
  if (t < T_RUN) return VW * sm(T_W0, T_W0 + 0.6, t);
  if (t < T_RUN + TA) return lerp(VW, VR, (t - T_RUN) / TA);
  if (t < T_DEC) return VR;
  if (t < T_STOP) return lerp(VR, 0, sm(T_DEC, T_STOP, t));
  return 0;
}
const gRun = v => clamp((v - VW) / (VR - VW));
// 거리·위상 적분표
const DT = 1 / 240, NT = Math.ceil(60 / DT) + 2, DIST = new Float64Array(NT), PH = new Float64Array(NT);
for (let i = 1; i < NT; i++) { const t = i * DT, v = speedAt(t - DT / 2), g = gRun(v);
  DIST[i] = DIST[i - 1] + v * DT; PH[i] = PH[i - 1] + v * DT / (lerp(SW, SR, g) * FIG_S); }
const tab = (A, t) => { const f = clamp(t, 0, 59.9) / DT, i = Math.floor(f); return lerp(A[i], A[i + 1], f - i); };
const X0 = -260;
const figX = t => X0 + tab(DIST, t);
const DOOR_X = figX(60) + 34;

function legFoot(q, d, S, lift) {
  if (q < d) { const u = q / d; return [S * d / 2 - S * d * u, 0]; }
  const u = (q - d) / (1 - d), e = 0.5 - 0.5 * Math.cos(Math.PI * u);
  return [-S * d / 2 + S * d * e, -lift * Math.sin(Math.PI * u)];
}
function ik(hx, hy, fx, fy, a, b, sgn) {
  const dx = fx - hx, dy = fy - hy, d = Math.min(Math.hypot(dx, dy), a + b - 0.01);
  const ang = Math.atan2(dy, dx), al = Math.acos(clamp((a * a + d * d - b * b) / (2 * a * d), -1, 1));
  const k = ang - sgn * al; return [hx + a * Math.cos(k), hy + a * Math.sin(k)];
}
function limb(p, w0, w1, k, lw, far) {
  const n = p.length, L = [], R = [];
  for (let i = 0; i < n; i++) {
    const a = p[Math.max(0, i - 1)], b = p[Math.min(n - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1]; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
    const w = lerp(w0, w1, i / (n - 1)) / 2;
    L.push([p[i][0] - dy * w, p[i][1] + dx * w]); R.push([p[i][0] + dy * w, p[i][1] - dx * w]);
  }
  const fillC = far ? mixHex(P.fill, P.ink, 0.12) : P.fill;
  ctx.beginPath(); trace(L.concat(R.slice().reverse()).map((q, i) => jp(q[0], q[1], k + i)), true); ctx.fillStyle = fillC; ctx.fill();
  const col = far ? hexA(P.ink.length === 7 ? P.ink : '#23262c', 0.62) : P.ink;
  const shorten = s => { const m = s.slice(); const a = m[n - 1], b = m[n - 2]; m[n - 1] = [lerp(a[0], b[0], 0.08), lerp(a[1], b[1], 0.08)]; return m; };
  pen(shorten(L), lw, k + 20, { col }); pen(shorten(R), lw, k + 40, { col });
}
/* opts: {phase, run(0-1), cover(0-1), stand(0-1), umbrella, scale, alpha} ; x,y = 발 기준 */
function person(x, y, o) {
  const s = o.scale || FIG_S, g = o.run || 0, st = o.stand || 0, lw = 2.5 / s;
  const S = lerp(SW, SR, g), d = lerp(0.62, 0.38, g), lift = lerp(16, 34, g);
  const p = o.phase || 0;
  const lean = lerp(0.04, 0.24, g) * (1 - st);
  const bob = lerp(2.2 * Math.cos(4 * Math.PI * (p - d / 2)), 5 * Math.sin(4 * Math.PI * (p - 0.1)), g);
  const hipH = lerp(lerp(95.5, 90, g) + bob, 99, st);
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.globalAlpha = o.alpha == null ? 1 : o.alpha;
  const hip = [0, -hipH];
  const feet = [0, 1].map(i => { const q = ((p + i * 0.5) % 1 + 1) % 1; const f = legFoot(q, d, S, lift); return [lerp(f[0], i ? -7 : 7, st), lerp(f[1], 0, st)]; });
  const sh = [hip[0] + Math.sin(lean) * 72, hip[1] - Math.cos(lean) * 72];
  const head = [sh[0] + Math.sin(lean) * 27, sh[1] - Math.cos(lean) * 27];
  const arm = (i) => {
    const q = ((p + i * 0.5) % 1 + 1) % 1;
    const sw = lerp(0.42, 0.95, g) * (1 - st);
    let a1 = Math.PI / 2 + sw * Math.cos(2 * Math.PI * q) + lean * 0.5;
    let bend = lerp(0.28 + 0.25 * Math.max(0, -Math.cos(2 * Math.PI * q)), 1.5, g) * (1 - st) + 0.12 * st;
    if (i === 0 && o.cover) { // 머리 위로 손을 올려 비를 막는다
      const c = o.cover, b2 = Math.sin(p * Math.PI * 4) * 0.06;
      a1 = lerp(a1, -1.05 + b2, c); bend = lerp(bend, 2.05, c);
    }
    if (i === 0 && o.umbrella) { a1 = Math.PI / 2 - 0.55; bend = 1.65; }
    const e = [sh[0] + Math.cos(a1) * 36, sh[1] + Math.sin(a1) * 36];
    const a2 = a1 - bend, hd = [e[0] + Math.cos(a2) * 34, e[1] + Math.sin(a2) * 34];
    return [[sh[0] + (i ? -3 : 3), sh[1] + 4], e, hd];
  };
  const leg = i => { const k = ik(hip[0], hip[1], feet[i][0], feet[i][1] - 4, 51, 51, 1); return [[hip[0] + (i ? -4 : 4), hip[1]], k, [feet[i][0], feet[i][1] - 4]]; };
  const shoe = (f, k, far) => pen([[f[0] - 7, f[1] - 2], [f[0] - 6, f[1] - 9], [f[0] + 9, f[1] - 7], [f[0] + 15, f[1] - 1], [f[0] + 4, f[1]]], lw, k, { closed: true, fill: far ? mixHex(P.ink, P.fill, .25) : P.ink, col: P.ink });
  // 먼 쪽 팔·다리
  const A1 = arm(1), L1 = leg(1), L0 = leg(0), A0 = arm(0);
  limb(A1, 10, 8, 300, lw, true);
  limb(L1, 15, 11, 400, lw, true); shoe(L1[2], 410, true);
  limb(L0, 15, 11, 500, lw, false); shoe(L0[2], 510, false);
  // 코트: 어깨에서 허벅지 중간까지, 밑단은 무릎을 따라 벌어진다
  const kf = Math.max(L0[1][0], L1[1][0]), kb = Math.min(L0[1][0], L1[1][0]);

const au = document.getElementById('au'), big = document.getElementById('big'), pp = document.getElementById('pp'), seek = document.getElementById('seek'), tm = document.getElementById('time');

let seeking = false;
function loop() {
  const t = au.currentTime || 0;

}
function toggle() {
  if (au.paused) { au.play().then(() => { big.hidden = true; pp.textContent = '일시정지'; requestAnimationFrame(loop); }).catch(() => {}); }

}

<title>현심</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&family=Gowun+Batang:wght@400;700&display=swap">
<style>
/* 레이아웃: 어두운 고정 페이지 가운데 9:16 필름 한 장, 아래 재생 컨트롤 */
:root{
  --page:#0d1018; --card:#161b26; --line:#2a3242; --fg:#efe6d2; --muted:#949bab; --gold:#ffc066;
  --display:"Gowun Batang", "AppleMyungjo", "Batang", serif;
  color-scheme:dark;
}
html,body{background:var(--page);color:var(--fg)}
body{font-family:var(--display);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 28px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-weight:700;font-size:26px;margin:0;letter-spacing:.12em}
header p{margin:0;color:var(--muted);font-size:13px}
.stage{position:relative;aspect-ratio:9/16;width:min(100%, calc(80vh * 9 / 16));min-width:min(100%,260px);max-width:100%;margin:0 auto;background:#000;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
canvas{display:block;width:100%;height:100%}
#big{position:absolute;inset:0;margin:auto;width:84px;height:84px;border-radius:50%;border:1px solid rgba(255,214,150,.6);background:rgba(13,16,24,.5);color:#ffe2b0;font:600 15px var(--display);cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.bar{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.bar button{background:none;border:1px solid var(--line);color:var(--fg);border-radius:4px;padding:6px 12px;font:14px var(--display);cursor:pointer;min-width:64px}
#seek{flex:1;min-width:0;accent-color:var(--gold)}
#time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;white-space:nowrap}
.note{color:var(--muted);font-size:12.5px;line-height:1.6;margin:0}
</style>

<div class="wrap">
  <header><h1>현심</h1><p>라인아트 뮤직비디오 · 9:16 · 2:46</p></header>
  <div class="stage">
    <canvas id="c" width="1080" height="1920" aria-label="겨울에 만난 촛불 같은 사람, 현심에게 바치는 라인아트 뮤직비디오"></canvas>
    <button id="big" type="button">재생</button>
  </div>
  <div class="bar">
    <button id="pp" type="button">재생</button>
    <input id="seek" type="range" min="0" max="166" step="0.05" value="0" aria-label="재생 위치">
    <span id="time">0:00 / 2:46</span>
  </div>
  <p class="note">작사·작곡 Gemini · 아트 디자인 Claude Code · 감독 성수</p>
</div>
<audio id="au" src="song.mp3" preload="auto"></audio>

<script>
(() => {
const W = 1080, H = 1920, DUR = 166;
const C = document.getElementById('c'), X = C.getContext('2d');
const mk = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const LA = mk(), LAX = LA.getContext('2d');
const DUMMY = mk(4, 4).getContext('2d');
let ctx = X;

// ---------- 수학 ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const sm = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const win = (t, a, b, f = 0.6) => sm(a - f, a + f * 0.3, t) * (1 - sm(b - f * 0.3, b + f, t));
const hh = (a, b = 0) => { const s = Math.sin(a * 127.1 + b * 311.7 + 0.123) * 43758.5453; return s - Math.floor(s); };
const hexA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${clamp(a)})`; };
const mixHex = (h1, h2, u) => { const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16); u = clamp(u);
  const r = Math.round(lerp(a >> 16, b >> 16, u)), g = Math.round(lerp((a >> 8) & 255, (b >> 8) & 255, u)), bl = Math.round(lerp(a & 255, b & 255, u));
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + bl).toString(16).slice(1); };
const easeOut = u => 1 - Math.pow(1 - clamp(u), 3);
const easeIO = u => { u = clamp(u); return u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };

// ---------- 색 ----------
const NIGHT = '#11151f', CREAM = '#efe6d2', DIM = '#7d8495', GOLD = '#ffc066', PINK = '#f3a6b8', LEAF = '#9cc28a', AUT = '#e0884a', SNOW = '#f4f6fb', PAPER = '#f1e7d6', SEPIA = '#2a2420';
const P = { bg: NIGHT, ink: CREAM, fill: NIGHT, accent: '#c9584a' };

// ---------- 펜 (그려지는 순서 공개 기능 포함) ----------
let fb = 0, J = 0.9;
const RV = { on: false, n: 0, lim: Infinity };
const RN = {};
function gate() { if (!RV.on) return 1; const i = RV.n++; if (i + 1 <= RV.lim) return 1; if (i >= RV.lim) return 0; return RV.lim - i; }
function reveal(key, u, fn) {
  if (u <= 0) return;
  if (!(key in RN)) { const sv = ctx; ctx = DUMMY; RV.on = true; RV.n = 0; RV.lim = Infinity; try { fn(); } finally { ctx = sv; } RN[key] = RV.n; }
  RV.on = u < 1; RV.n = 0; RV.lim = u * RN[key]; fn(); RV.on = false;
}
function jp(x, y, k) { return [x + (hh(k, fb) - .5) * 2 * J, y + (hh(k + 71.3, fb) - .5) * 2 * J]; }
function trace(q, closed) {
  const n = q.length;
  if (n === 2) { ctx.moveTo(q[0][0], q[0][1]); ctx.lineTo(q[1][0], q[1][1]); return; }
  if (closed) { const m = (i, j) => [(q[i][0] + q[j][0]) / 2, (q[i][1] + q[j][1]) / 2];
    const s = m(n - 1, 0); ctx.moveTo(s[0], s[1]);
    for (let i = 0; i < n; i++) { const e = m(i, (i + 1) % n); ctx.quadraticCurveTo(q[i][0], q[i][1], e[0], e[1]); }
    ctx.closePath(); return; }
  ctx.moveTo(q[0][0], q[0][1]);
  for (let i = 1; i < n - 1; i++) { const e = [(q[i][0] + q[i + 1][0]) / 2, (q[i][1] + q[i + 1][1]) / 2]; ctx.quadraticCurveTo(q[i][0], q[i][1], e[0], e[1]); }
  ctx.lineTo(q[n - 1][0], q[n - 1][1]);
}
const plen = q => { let L = 0; for (let i = 1; i < q.length; i++) L += Math.hypot(q[i][0] - q[i - 1][0], q[i][1] - q[i - 1][1]); return L; };
function pen(pts, w = 2.2, k = 0, o = {}) {
  const f = gate(); if (f <= 0) return;
  const q = pts.map((p, i) => jp(p[0], p[1], k + i * 1.37));
  ctx.beginPath();
  if (o.sharp) { ctx.moveTo(q[0][0], q[0][1]); for (let i = 1; i < q.length; i++) ctx.lineTo(q[i][0], q[i][1]); if (o.closed) ctx.closePath(); }
  else trace(q, !!o.closed);
  if (o.fill && f >= 1) { ctx.fillStyle = o.fill; ctx.fill(); }
  if (w > 0) {
    if (f < 1) { const L = plen(o.closed ? q.concat([q[0]]) : q) * 1.08 + 4; ctx.setLineDash([L * f, L * 2]); }
    ctx.lineWidth = w; ctx.strokeStyle = o.col || P.ink; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
    if (f < 1) ctx.setLineDash([]);
  }
}
const ln = (x1, y1, x2, y2, w = 2, k = 0, col) => { const mx = (x1 + x2) / 2 + (hh(k, 3.3) - .5) * Math.hypot(x2 - x1, y2 - y1) * 0.02, my = (y1 + y2) / 2; pen([[x1, y1], [mx, my], [x2, y2]], w, k, { col }); };
function ell(x, y, rx, ry, lw = 2, k = 0, o = {}) {
  const n = o.n || 14, pts = [];
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; const cx = Math.cos(a) * rx, cy = Math.sin(a) * ry, r = o.rot || 0;
    pts.push([x + cx * Math.cos(r) - cy * Math.sin(r), y + cx * Math.sin(r) + cy * Math.cos(r)]); }
  pen(pts, lw, k, { closed: true, fill: o.fill, col: o.col });
}
function box(x, y, w, h, lw = 2, k = 0, o = {}) { pen([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], lw, k, { sharp: true, closed: true, fill: o.fill, col: o.col }); }
function glow(x, y, r, col, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, hexA(col, a)); g.addColorStop(0.3, hexA(col, a * 0.5)); g.addColorStop(1, hexA(col, 0));
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
function bg(col) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = col; ctx.fillRect(0, 0, W, H); }

// ---------- 입자 ----------
function snow(t, n, o = {}) {
  const wind = o.wind || 0, sp = o.speed || 60, a0 = o.alpha == null ? 0.9 : o.alpha, col = o.col || SNOW;
  for (let i = 0; i < n; i++) {
    const s = 1.2 + hh(i, 2) * 3.6, v = sp * (0.5 + s / 4);
    const y = ((hh(i, 1) * (H + 200) + t * v) % (H + 200)) - 100;
    let x = (hh(i, 3) * (W + 400) + t * wind * (0.6 + s / 5) + Math.sin(t * 0.8 + i) * 18) % (W + 400); if (x < 0) x += W + 400; x -= 200;
    ctx.globalAlpha = a0 * (0.4 + s / 6);
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, s, 0, Math.PI * 2); ctx.fill();
    if (wind > 200) { ctx.strokeStyle = col; ctx.lineWidth = s * 0.6; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - wind * 0.05 * s, y - 4); ctx.stroke(); }
  }
  ctx.globalAlpha = 1;
}
function petal(x, y, r, rot, col, a) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.globalAlpha = a;
  ctx.beginPath(); ctx.moveTo(0, -r); ctx.quadraticCurveTo(r * 0.9, -r * 0.2, 0, r); ctx.quadraticCurveTo(-r * 0.9, -r * 0.2, 0, -r);
  ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = 1; ctx.strokeStyle = hexA('#7a3346', 0.5); ctx.stroke(); ctx.restore(); ctx.globalAlpha = 1;
}
function petals(t, n, col, o = {}) {
  const sp = o.speed || 90, wind = o.wind == null ? 60 : o.wind, a = o.alpha == null ? 1 : o.alpha;
  for (let i = 0; i < n; i++) {
    const v = sp * (0.6 + hh(i, 11) * 0.8);
    const y = ((hh(i, 12) * (H + 300) + t * v) % (H + 300)) - 150;
    let x = (hh(i, 13) * (W + 400) + t * wind + Math.sin(t * 1.3 + i * 2) * 40) % (W + 400); if (x < 0) x += W + 400; x -= 200;
    petal(x, y, 6 + hh(i, 14) * 7, t * (1 + hh(i, 15) * 2) + i, col, a * (0.6 + 0.4 * hh(i, 16)));
  }
}
function flower(x, y, r, n, col, rot, lw, k, bloom) {
  if (bloom <= 0) return;
  const rr = r * easeOut(bloom);
  for (let i = 0; i < n; i++) { const a = rot + i / n * Math.PI * 2, a1 = a - Math.PI / n * 0.9, a2 = a + Math.PI / n * 0.9;
    pen([[x, y], [x + Math.cos(a1) * rr * 0.8, y + Math.sin(a1) * rr * 0.8], [x + Math.cos(a) * rr, y + Math.sin(a) * rr], [x + Math.cos(a2) * rr * 0.8, y + Math.sin(a2) * rr * 0.8], [x, y]], lw, k + i * 7, { col }); }
  ctx.fillStyle = GOLD; ctx.beginPath(); ctx.arc(x, y, rr * 0.16, 0, Math.PI * 2); ctx.fill();
}

// ---------- 사람 (옆모습) ----------
const SW = 130;
function legFoot(q, d, S, lift) {
  if (q < d) { const u = q / d; return [S * d / 2 - S * d * u, 0]; }
  const u = (q - d) / (1 - d), e = 0.5 - 0.5 * Math.cos(Math.PI * u);
  return [-S * d / 2 + S * d * e, -lift * Math.sin(Math.PI * u)];
}
function ik(hx, hy, fx, fy, a, b, sgn) {
  const dx = fx - hx, dy = fy - hy, d = Math.min(Math.hypot(dx, dy), a + b - 0.01);
  const ang = Math.atan2(dy, dx), al = Math.acos(clamp((a * a + d * d - b * b) / (2 * a * d), -1, 1));
  const k = ang - sgn * al; return [hx + a * Math.cos(k), hy + a * Math.sin(k)];
}
function limb(p, w0, w1, k, lw, far) {
  const n = p.length, L = [], R = [];
  for (let i = 0; i < n; i++) { const a = p[Math.max(0, i - 1)], b = p[Math.min(n - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1]; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
    const w = lerp(w0, w1, i / (n - 1)) / 2; L.push([p[i][0] - dy * w, p[i][1] + dx * w]); R.push([p[i][0] + dy * w, p[i][1] - dx * w]); }
  const col = far ? mixHex(P.ink, P.fill, 0.4) : P.ink;
  if (!RV.on || gate() >= 1) { ctx.beginPath(); trace(L.concat(R.slice().reverse()).map((q, i) => jp(q[0], q[1], k + i)), true); ctx.fillStyle = far ? mixHex(P.fill, P.ink, 0.08) : P.fill; ctx.fill(); }
  pen(L, lw, k + 20, { col }); pen(R, lw, k + 40, { col });
}
/* o: phase, stand, scale, hair(색), fem, stoop(0-1), scarf, umbrella, hold(손잡기: 1 앞으로, -1 뒤로) , alpha */
function person(x, y, o) {
  const s = o.scale || 1.5, st = o.stand || 0, lw = 2.4 / s, g = 0;
  const S = SW * (1 - 0.25 * (o.stoop || 0)), d = 0.62, lift = 14;
  const p = o.phase || 0, stoop = o.stoop || 0;
  const lean = 0.04 + stoop * 0.16;
  const bob = 2.2 * Math.cos(4 * Math.PI * (p - d / 2)) * (1 - st);
  const hipH = lerp(95.5 + bob - stoop * 3, 99 - stoop * 3, st);
  ctx.save(); ctx.translate(x, y); ctx.scale((o.dir || 1) * s, s); if (o.alpha != null) ctx.globalAlpha = o.alpha;
  const hip = [0, -hipH];
  const feet = [0, 1].map(i => { const q = ((p + i * 0.5) % 1 + 1) % 1; const f = legFoot(q, d, S, lift); return [lerp(f[0], i ? -7 : 7, st), lerp(f[1], 0, st)]; });
  const sh = [hip[0] + Math.sin(lean) * 72, hip[1] - Math.cos(lean) * 72];
  const head = [sh[0] + Math.sin(lean + stoop * 0.3) * 27, sh[1] - Math.cos(lean + stoop * 0.3) * 27];
  const arm = (i) => {
    const q = ((p + i * 0.5) % 1 + 1) % 1, sw = 0.4 * (1 - st);
    let a1 = Math.PI / 2 + sw * Math.cos(2 * Math.PI * q) + lean * 0.5, bend = 0.28 + 0.25 * Math.max(0, -Math.cos(2 * Math.PI * q)) * (1 - st) + 0.12 * st;
    if (o.umbrella && i === 0) { a1 = Math.PI / 2 - 0.55; bend = 1.65; }
    if (o.hold && i === (o.hold > 0 ? 0 : 1)) { a1 = Math.PI / 2 - 0.42 * o.hold; bend = 0.1 * o.hold; }
    if (o.candle && i === 0) { a1 = Math.PI / 2 - 0.35; bend = 1.45; }
    const e = [sh[0] + Math.cos(a1) * 36, sh[1] + Math.sin(a1) * 36], a2 = a1 - bend, hd = [e[0] + Math.cos(a2) * 34, e[1] + Math.sin(a2) * 34];
    return [[sh[0] + (i ? -3 : 3), sh[1] + 4], e, hd];
  };
  const leg = i => { const k = ik(hip[0], hip[1], feet[i][0], feet[i][1] - 4, 51, 51, 1); return [[hip[0] + (i ? -4 : 4), hip[1]], k, [feet[i][0], feet[i][1] - 4]]; };
  const shoe = (f, k, far) => pen([[f[0] - 7, f[1] - 2], [f[0] - 6, f[1] - 9], [f[0] + 9, f[1] - 7], [f[0] + 15, f[1] - 1], [f[0] + 4, f[1]]], lw, k, { closed: true, fill: far ? mixHex(P.ink, P.fill, .5) : P.ink });
  const A1 = arm(1), L1 = leg(1), L0 = leg(0), A0 = arm(0);
  limb(A1, 10, 8, 300, lw, true);
  limb(L1, 15, 11, 400, lw, true); shoe(L1[2], 410, true);
  limb(L0, 15, 11, 500, lw, false); shoe(L0[2], 510, false);
  const kf = Math.max(L0[1][0], L1[1][0]), kb = Math.min(L0[1][0], L1[1][0]);
  const hemY = hip[1] + (o.fem ? 62 : 34);
  const fl = o.fem ? 10 : 0;
  pen([[sh[0] - 15, sh[1] + 2], [sh[0] + 14, sh[1] + 2], [hip[0] + 16 + Math.sin(lean) * 4, hip[1] - 6],
    [Math.max(hip[0] + 20 + fl, kf * 0.85 + 6), hemY - 3], [hip[0] + 2, hemY + 2], [Math.min(hip[0] - 20 - fl, kb * 0.85 - 6), hemY - 2], [hip[0] - 17, hip[1] - 8]], lw, 600, { closed: true, fill: P.fill });
  pen([[hip[0] - 16, hip[1] - 12], [hip[0] + 15, hip[1] - 11]], lw * 0.8, 610);
  // 머리
  const hair = o.hair || P.ink;
  if (o.fem) pen([[head[0] - 4, head[1] - 18], [head[0] - 16, head[1] - 8], [head[0] - 19, head[1] + 14], [head[0] - 22, head[1] + 38 - stoop * 14], [head[0] - 10, head[1] + 30 - stoop * 10], [head[0] - 4, head[1] + 8]], lw, 690, { closed: true, fill: hair });
  ell(head[0], head[1] - 4, 12.5, 14, lw, 700, { fill: P.fill });
  pen([[head[0] - 12, head[1] - 4], [head[0] - 9, head[1] - 16], [head[0] + 3, head[1] - 20], [head[0] + 12, head[1] - 12], [head[0] + 6, head[1] - 10], [head[0] - 4, head[1] - 9], [head[0] - 8, head[1] + 2]], lw, 720, { closed: true, fill: hair });
  pen([[head[0] + 12, head[1] - 3], [head[0] + 15, head[1] + 1], [head[0] + 11, head[1] + 2]], lw * 0.8, 730);
  if (o.scarf) { const sw = Math.sin(p * Math.PI * 4) * 3 + (o.wind || 0) * 14;
    pen([[sh[0] - 11, sh[1] - 2], [sh[0] + 10, sh[1] - 1], [sh[0] + 9, sh[1] + 6], [sh[0] - 10, sh[1] + 6]], lw, 740, { closed: true, fill: o.scarf });
    pen([[sh[0] - 9, sh[1] + 3], [sh[0] - 18 - sw, sh[1] + 12 - (o.wind || 0) * 10], [sh[0] - 26 - sw * 1.6, sh[1] + 22 - (o.wind || 0) * 20], [sh[0] - 19 - sw, sh[1] + 25 - (o.wind || 0) * 18], [sh[0] - 8, sh[1] + 9]], lw, 760, { closed: true, fill: o.scarf }); }
  limb(A0, 10, 8, 800, lw, false);
  const out = { hand0: A0[2], hand1: A1[2], head };
  if (o.umbrella) { const hd = A0[2]; pen([[hd[0], hd[1] + 6], [hd[0] - 1, hd[1] - 118]], lw, 820);
    const tp = [hd[0] - 1, hd[1] - 118];
    pen([[tp[0] - 78, tp[1] + 30], [tp[0] - 52, tp[1] + 2], [tp[0], tp[1] - 10], [tp[0] + 52, tp[1] + 2], [tp[0] + 78, tp[1] + 30], [tp[0] + 52, tp[1] + 22], [tp[0] + 26, tp[1] + 30], [tp[0], tp[1] + 22], [tp[0] - 26, tp[1] + 30], [tp[0] - 52, tp[1] + 22]], lw, 840, { sharp: true, closed: true, fill: o.umbrella }); }
  if (o.candle) { const hd = A0[2]; box(hd[0] - 5, hd[1] - 30, 10, 34, lw, 860, { fill: CREAM }); out.flame = [hd[0], hd[1] - 40]; }
  ctx.restore();
  const tr = q => [x + q[0] * s * (o.dir || 1), y + q[1] * s];
  out.hand0 = tr(out.hand0); out.hand1 = tr(out.hand1); out.head = tr(out.head); if (out.flame) out.flame = tr(out.flame);
  return out;
}

// ---------- 촛불 ----------
function flame(x, y, s, t, a = 1) {
  const fl = Math.sin(t * 13) * 0.08 + Math.sin(t * 7.3) * 0.06;
  ctx.save(); ctx.globalAlpha = a;
  glow(x, y - 10 * s, 320 * s, GOLD, 0.55);
  glow(x, y - 10 * s, 90 * s, '#fff1cc', 0.7);

  const SK = [[81.8, 2.6], [85.0, 3.0], [87.7, 4.0], [90.8, 5.0], [92.6, 6.0], [94.4, 7.0], [96.2, 7.0], [97.0, 8.0], [99.5, 9.0], [101.2, 10.0], [102.6, 11.0], [106, 11.0]];
  let season = SK[0][1]; for (let i = 0; i < SK.length - 1; i++) if (t >= SK[i][0]) season = lerp(SK[i][1], SK[i + 1][1], sm(SK[i][0], SK[i + 1][0], t));
  const sw = seasonW(season);
  bg(mixHex(mixHex('#141a28', '#1d2433', sw[1]), '#221a26', sw[0] * 0.6));
  const z = lerp(1.3, 0.95, easeIO(u));
  ctx.setTransform(z, 0, 0, z, W / 2 - 540 * z, H / 2 - lerp(1050, 880, easeIO(u)) * z);
  ln(-400, 1300, 1500, 1302, 2.8, 41);
  // 해와 달이 지나간다
  for (let i = 0; i < 8; i++) { const a = (t * 0.6 + i * 0.785) % (Math.PI * 2); ctx.globalAlpha = 0.25; ell(540 + Math.cos(a) * 700, 900 + Math.sin(a) * 600, 24, 24, 1.6, 42 + i, { fill: i % 2 ? NIGHT : hexA(GOLD, 0.5) }); }
  ctx.globalAlpha = 1;
  tree(TREE_B, 420, 1300, lerp(0.2, 0.9, easeOut(u)), lerp(0.25, 1, sm(81.8, 92, t)), season, t);
  benchCouple(640, 1300, 0.95, lerp(0.3, 0.92, u), 1, 1200);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (sw[0] > 0.05) petals(t, Math.round(110 * sw[0]), PINK, { alpha: sw[0] });
  if (sw[3] > 0.05) snow(t, Math.round(300 * sw[3]), { speed: 80 });
  if (sw[2] > 0.1) petals(t * 0.8 + 30, Math.round(50 * sw[2]), AUT, { alpha: sw[2], speed: 120, wind: 90 });
}

// 8) 바람 속에서 손을 놓지 않는 두 사람 → 새벽 → 기준점 (105.5 - 117.5)
function sWind(t) {
  P.bg = NIGHT; P.ink = CREAM; P.fill = NIGHT; J = 1.0;
  const dawn = sm(110.5, 114.2, t);
  bg(mixHex('#0f131d', '#2b2433', dawn));
  const zw = 1.25; ctx.setTransform(zw, 0, 0, zw, W / 2 - 560 * zw, H / 2 - 1060 * zw);
  // 새벽 하늘 띠
  if (dawn > 0) { const g = ctx.createLinearGradient(0, 700, 0, 1300); g.addColorStop(0, hexA('#2b2433', 0)); g.addColorStop(1, hexA('#f0a070', 0.55 * dawn)); ctx.fillStyle = g; ctx.fillRect(-300, 700, W + 600, 600); }
  const gy = 1300;
  // 해: 지평선 너머에서 떠오른다
  const sunY = lerp(gy + 120, gy - 150, easeOut(sm(112.6, 116, t)));
  ctx.save(); ctx.beginPath(); ctx.rect(-300, -300, W + 600, gy + 300); ctx.clip();
  ctx.globalCompositeOperation = 'lighter'; glow(820, sunY, 700 * (0.3 + dawn), GOLD, 0.5 * dawn); ctx.globalCompositeOperation = 'source-over';
  ell(820, sunY, 90, 90, 3, 61, { fill: hexA(GOLD, 0.9 * dawn), col: GOLD });
  ctx.restore();
  // 기준점: 해 위로 그려지는 나침반 별
  const cp = sm(114.4, 116.4, t);
  if (cp > 0) { ctx.save(); ctx.translate(820, sunY); ctx.rotate(t * 0.05);
    for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2, L = (i % 2 ? 170 : 330) * easeOut(cp);
      pen([[Math.cos(a - 0.12) * 100, Math.sin(a - 0.12) * 100], [Math.cos(a) * L, Math.sin(a) * L], [Math.cos(a + 0.12) * 100, Math.sin(a + 0.12) * 100]], 2.4, 70 + i, { col: GOLD }); }
    ell(0, 0, 150 * easeOut(cp), 150 * easeOut(cp), 1.6, 80, { col: hexA(GOLD, 0.7) });
    ctx.restore(); }
  ln(-100, gy, 1200, gy + 2, 2.8, 62);
  // 길
  pen([[300, gy], [520, gy + 160], [700, gy + 400]], 2, 63, { col: DIM }); pen([[900, gy], [960, gy + 160], [1020, gy + 400]], 2, 64, { col: DIM });
  // 두 노인이 손을 잡고 바람을 거슬러 걷는다 (화면 왼쪽 → 오른쪽)
  const wind = 1 - dawn * 0.8, walk = (t - 105.5) * 30;
  const x0 = 200 + walk;
  const A = person(x0 - 46, gy, { phase: walk / (SW * 1.5 * 0.75), scale: 1.5, hair: SNOW, stoop: 0.55 + 0.2 * wind, scarf: '#c9584a', wind, hold: 1 });
  const B = person(x0 + 46, gy, { phase: walk / (SW * 1.42 * 0.75) + 0.5, scale: 1.42, hair: SNOW, fem: true, stoop: 0.5 + 0.2 * wind, wind, hold: -1 });
  // 맞잡은 손
  const hx = (A.hand0[0] + B.hand1[0]) / 2, hy2 = (A.hand0[1] + B.hand1[1]) / 2;
  pen([A.hand0, [hx, hy2 + 4], B.hand1], 3, 90);
  ell(hx, hy2 + 2, 10, 8, 2.4, 91, { fill: NIGHT });
  ctx.globalCompositeOperation = 'lighter'; glow(hx, hy2, 80 + 40 * Math.sin(t * 3), GOLD, 0.35 + 0.3 * sm(107.3, 108.4, t)); ctx.globalCompositeOperation = 'source-over';
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // 바람 줄기
  ctx.lineCap = 'round';
  for (let i = 0; i < 70 * wind; i++) { const y = hh(i, 1) * 1400 + 100, v = 900 + hh(i, 2) * 900, L = 80 + hh(i, 3) * 220;
    const x = W + 300 - ((t * v + hh(i, 4) * 3000) % (W + 700));
    ctx.strokeStyle = hexA(CREAM, 0.25 + 0.3 * hh(i, 5)); ctx.lineWidth = 1.2 + hh(i, 6) * 1.6;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + L / 2, y - 10 * Math.sin(i + t * 3), x + L, y); ctx.stroke(); }
  snow(t, Math.round(260 * wind), { speed: 120, wind: -520 });
}

// 9) 하트 나무 (마지막 후렴): 벤치에서 시작해 크게 물러나며 드러난다 (117 - 141)
function sHeartTree(t) {
  P.bg = NIGHT; P.ink = CREAM; P.fill = NIGHT; J = 0.8;
  const pull = easeIO(sm(117.2, 123.5, t));
  const season = 0 + 3.0 * sm(134.6, 139.8, t);   // 봄 → 겨울로 저문다
  const sw = seasonW(season);
  const pinkBurst = sm(131.3, 132.4, t) * (1 - sm(134.6, 137, t));
  bg(mixHex(mixHex('#141a28', '#2a1c2a', 0.5 * sw[0] + 0.3 * pinkBurst), '#141a28', sw[3]));
  const z = lerp(2.4, 0.86, pull), cx = lerp(560, 540, pull), cy = lerp(1160, 900, pull);
  ctx.setTransform(z, 0, 0, z, W / 2 - cx * z, H / 2 - cy * z);
  ln(-600, 1300, 1700, 1302, 2.8, 51);
  // 별
  for (let i = 0; i < 80; i++) { ctx.globalAlpha = 0.3 + 0.3 * Math.sin(t * 2 + i); ctx.fillStyle = CREAM; ctx.fillRect(-400 + hh(i, 1) * 1900, -500 + hh(i, 2) * 900, 2.5, 2.5); }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'lighter'; glow(540, 520, 900, PINK, 0.12 + 0.25 * pinkBurst); ctx.globalCompositeOperation = 'source-over';
  tree(TREE_B, 540, 1300, 1.25, sm(117.2, 124.5, t) * 0.55 + 0.45, season, t, { heart: 560, heartY: 820, big: 1.6 + 0.6 * pinkBurst });
  benchCouple(560, 1300, 0.62, 0.95, 1, 1300);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // 금빛 반딧불
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 50; i++) { const x = W / 2 + Math.sin(t * 0.3 + i * 1.7) * 480 + (hh(i, 2) - .5) * 200, y = 400 + hh(i, 3) * 1100 + Math.cos(t * 0.5 + i) * 60;
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 3 + i * 2); glow(x, y, 18, GOLD, 0.8); }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  petals(t, Math.round(70 + 160 * pinkBurst) * (1 - sw[3]), PINK, { alpha: 1 - sw[3], speed: 90 + 80 * pinkBurst, wind: 70 });
  if (sw[3] > 0.05) snow(t, Math.round(260 * sw[3]), { speed: 60 });
}

// 10) 촛불 앞의 두 사람 (마무리)
function sOutro(t) {
  P.bg = '#140f0c'; P.ink = CREAM; P.fill = '#140f0c'; J = 0.8;
  const morning = sm(150.4, 153.6, t);
  bg(mixHex('#140f0c', '#2a2018', morning));
  // 창
  const wx = 190, wy = 260, ww = 700, wh = 760;
  ctx.save(); ctx.beginPath(); ctx.rect(wx, wy, ww, wh); ctx.clip();
  const sky = ctx.createLinearGradient(0, wy, 0, wy + wh); sky.addColorStop(0, mixHex('#0e1322', '#f6d8c0', morning)); sky.addColorStop(1, mixHex('#1a2133', '#fbe8d0', morning));
  ctx.fillStyle = sky; ctx.fillRect(wx, wy, ww, wh);
  if (morning < 1) { ctx.globalAlpha = 1 - morning; for (let i = 0; i < 60; i++) { ctx.fillStyle = CREAM; ctx.fillRect(wx + hh(i, 1) * ww, wy + hh(i, 2) * wh * 0.6, 2, 2); } ctx.globalAlpha = 1; }
  if (morning > 0) { P.ink = mixHex(CREAM, SEPIA, morning); P.fill = mixHex('#140f0c', '#fbe8d0', morning); tree(TREE_A, wx + ww - 120, wy + wh + 40, 0.9, 1, 0, t); P.ink = CREAM; P.fill = '#140f0c'; }
  ctx.restore();
  box(wx, wy, ww, wh, 3, 7000); ln(wx + ww / 2, wy, wx + ww / 2, wy + wh, 2.6, 7001); ln(wx, wy + wh / 2, wx + ww, wy + wh / 2, 2.6, 7002);
  pen([[wx - 40, wy + wh], [wx + ww + 40, wy + wh], [wx + ww + 54, wy + wh + 30], [wx - 54, wy + wh + 30]], 2.6, 7003, { sharp: true, closed: true, fill: P.fill });
  if (morning > 0) { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = morning * 0.6;
    for (let i = 0; i < 6; i++) { const g = ctx.createLinearGradient(wx + ww / 2, wy + wh / 2, 540, 1700); g.addColorStop(0, hexA('#ffe0b0', 0.3)); g.addColorStop(1, hexA('#ffe0b0', 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(wx + 60 + i * 110, wy + wh); ctx.lineTo(wx + 110 + i * 110, wy + wh); ctx.lineTo(180 + i * 160 + 80, 1900); ctx.lineTo(120 + i * 160, 1900); ctx.fill(); }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; }
  // 창턱의 초
  candle(540, wy + wh, 1.0, t, 1 - sm(152.5, 154.5, t), 0);
  // 두 사람의 뒷모습
  benchCouple(540, 1500, 1.25, 0.97, sm(147.6, 149.4, t) * 0.6 + 0.4, 7100, { hairDark: '#1a1d26' });
  // 이름: 촛불 연기처럼
  const nm = sm(144.5, 146.4, t) * (1 - sm(149.6, 151, t));
  if (nm > 0) { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 1;
    brushText('현심', 540, wy + 330, 300, sm(144.5, 146.2, t), hexA('#ffd690', nm), { glow: GOLD, blur: 50 });
    ctx.globalCompositeOperation = 'source-over'; }
  if (morning > 0.2) petals(t, Math.round(60 * morning), PINK, { alpha: morning, speed: 60 });
}

// 11) 엔딩 크레딧
function sCredits(t) {
  bg('#0b0d12');
  const a = sm(154.6, 155.6, t);
  ctx.globalCompositeOperation = 'lighter'; glow(W / 2, 760, 700, GOLD, 0.1 * a); ctx.globalCompositeOperation = 'source-over';
  brushText('현심', W / 2, 700, 340, sm(154.8, 156.4, t), '#ffe2a8', { glow: GOLD, blur: 40 });
  const rows = [['작사 · 작곡', 'Gemini', 157.2], ['아트 디자인', 'Claude Code', 158.4], ['감독', '성수', 159.6]];
  ctx.textBaseline = 'alphabetic';
  rows.forEach(([k, v, st], i) => { const u = sm(st, st + 0.9, t); if (u <= 0) return;
    const y = 1040 + i * 130 + (1 - u) * 16;
    ctx.globalAlpha = u; ctx.textAlign = 'center';
    ctx.font = '400 32px "Gowun Batang", serif'; ctx.fillStyle = '#a7a196'; ctx.fillText(k, W / 2, y);
    ctx.font = '700 52px "Gowun Batang", serif'; ctx.fillStyle = CREAM; ctx.fillText(v, W / 2, y + 62); });
  ctx.globalAlpha = 1;
  // 아래에서 작게 타는 초 하나
  P.ink = hexA(CREAM, 0.8) ; P.fill = '#0b0d12';
  ctx.globalAlpha = sm(160.5, 161.6, t);
  candle(W / 2, 1640, 0.6, t, sm(160.8, 161.8, t), 900);
  ctx.globalAlpha = 1;
  const out = sm(164.4, 166, t); if (out > 0) { ctx.fillStyle = hexA('#000000', out); ctx.fillRect(0, 0, W, H); }
}

// ---------- 장면표 ----------
const SCENES = [
  [0, 33.7, t => { sWinter(t); sWinterFlame(t); }],
  [33.2, 41.2, sName1],
  [40.6, 46.4, sChorus1],
  [45.8, 53.0, sEye],
  [52.4, 61.6, sChorus1b],
  [61.0, 75.8, sSketch],
  [75.2, 82.2, sStars],
  [81.6, 105.9, sTreeLapse],
  [105.4, 117.6, sWind],
  [117.0, 141.2, sHeartTree],
  [140.6, 155.0, sOutro],
  [154.4, 166.1, sCredits],
];
const FADE = 0.55;
function render(t) {
  t = clamp(t, 0, DUR - 0.001);
  fb = Math.floor(t * 8);
  X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = 1; X.globalCompositeOperation = 'source-over';
  const act = SCENES.filter(s => t >= s[0] && t < s[1]);
  act.forEach((s, i) => {
    let a = 1;
    if (i > 0) a = clamp((t - s[0]) / FADE);
    if (i === 0) { ctx = X; s[2](t); }
    else { ctx = LAX; LAX.setTransform(1, 0, 0, 1, 0, 0); LAX.globalAlpha = 1; LAX.globalCompositeOperation = 'source-over'; LAX.clearRect(0, 0, W, H); s[2](t);
      X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = a; X.drawImage(LA, 0, 0); X.globalAlpha = 1; }
  });
  ctx = X;
  X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = 1; X.globalCompositeOperation = 'source-over';
  const fi = 1 - sm(0, 2.5, t); if (fi > 0) { X.fillStyle = hexA('#000000', fi); X.fillRect(0, 0, W, H); }
  lyric(t);
  // 은은한 비네팅
  const v = X.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.75); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.35)');
  X.fillStyle = v; X.fillRect(0, 0, W, H);
}

// ---------- 재생 ----------
const au = document.getElementById('au'), big = document.getElementById('big'), pp = document.getElementById('pp'), seek = document.getElementById('seek'), tm = document.getElementById('time');
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
let seeking = false;
function loop() { const t = au.currentTime || 0; render(t); if (!seeking) seek.value = t; tm.textContent = `${fmt(t)} / ${fmt(DUR)}`; if (!au.paused) requestAnimationFrame(loop); }
function toggle() { if (au.paused) au.play().then(() => { big.hidden = true; pp.textContent = '일시정지'; requestAnimationFrame(loop); }).catch(() => {}); else { au.pause(); pp.textContent = '재생'; } }
big.addEventListener('click', toggle); pp.addEventListener('click', toggle);
au.addEventListener('ended', () => { pp.textContent = '다시 재생'; big.hidden = false; big.textContent = '다시'; });
seek.addEventListener('input', () => { seeking = true; render(+seek.value); tm.textContent = `${fmt(+seek.value)} / ${fmt(DUR)}`; });
seek.addEventListener('change', () => { au.currentTime = +seek.value; seeking = false; if (au.paused) render(+seek.value); });
const ready = Promise.all([
  document.fonts.load('520px "Nanum Brush Script"', '현심우리의하루'),
  document.fonts.load('700 54px "Gowun Batang"', '가나다현심작사곡'),
  document.fonts.load('400 32px "Gowun Batang"', '작사곡아트디자인감독'),
]).catch(() => {});
window.__render = t => render(t);
window.__ready = ready.then(() => { NAMEPTS = null; return true; });
const q = new URLSearchParams(location.search);
ready.then(() => { NAMEPTS = null; render(q.has('t') ? +q.get('t') : 34.8); });
render(0.0001);
})();
</script>
